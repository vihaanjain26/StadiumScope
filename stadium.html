<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- main.js replaces this title with the stadium's name once it renders -->
  <title>Stadium — Stadium Scope</title>
  <meta name="description" content="Full review, category ratings and details for a single stadium.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>

<!--
  This one page renders every stadium. It reads ?id= from the URL, finds the
  matching object in data/stadiums.js and builds the page from it.
  Example: stadium.html?id=lambeau-field
-->
<body data-page="stadium">

  <nav class="nav">
    <div class="shell nav-inner">
      <a href="index.html" class="brand"><svg class="brand-mark" viewBox="0 0 26 17" aria-hidden="true">
          <rect x="1.3" y="1.3" width="23.4" height="14.4" rx="7.2"
                fill="none" stroke="currentColor" stroke-width="2.4"/>
          <rect x="7" y="5.2" width="12" height="6.6" rx="1" fill="currentColor"/>
        </svg> Stadium Scope</a>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="rankings.html">Rankings</a>
        <a class="nav-link" href="nfl.html">NFL</a>
        <a class="nav-link" href="mlb.html">MLB</a>
        <a class="nav-link" href="nba.html">NBA</a>
      </div>
    </div>
  </nav>

  <!-- Everything below is written by renderStadiumPage() in main.js -->
  <main id="stadium-root"></main>

  <footer class="footer">
    <div class="shell flex flex-col sm:flex-row justify-between gap-6">
      <div>
        <p class="brand"><svg class="brand-mark" viewBox="0 0 26 17" aria-hidden="true">
          <rect x="1.3" y="1.3" width="23.4" height="14.4" rx="7.2"
                fill="none" stroke="currentColor" stroke-width="2.4"/>
          <rect x="7" y="5.2" width="12" height="6.6" rx="1" fill="currentColor"/>
        </svg> Stadium Scope</p>
        <p class="text-sm mt-3" style="color:var(--ink-soft)">A personal, opinionated stadium ranking project.</p>
      </div>
      <div class="flex gap-8 text-sm" style="color:var(--ink-soft)">
        <a class="link-u" href="rankings.html">Rankings</a>
        <a class="link-u" href="nfl.html">NFL</a>
        <a class="link-u" href="mlb.html">MLB</a>
        <a class="link-u" href="nba.html">NBA</a>
      </div>
      <p class="text-sm" style="color:var(--ink-faint)">© <span data-year></span> Stadium Scope</p>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="data/stadiums.js"></script>
  <script src="main.js"></script>
</body>
</html>
